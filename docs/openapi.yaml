openapi: 3.0.3
info:
  title: Jewelry Catalog API
  version: 1.0.0
  description: REST API for managing and searching a jewelry product catalog.
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /api/auth/register:
    post:
      summary: Register an admin account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': { description: Created }
        '403': { description: Invalid registration key }
  /api/auth/login:
    post:
      summary: Login as admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
  /api/auth/me:
    get:
      summary: Current admin profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
  /api/products:
    get:
      summary: List, search, and filter products
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: minPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: inStock, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: sortBy, schema: { type: string, enum: [name, price, stock, createdAt, updatedAt] } }
        - { in: query, name: sortOrder, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: Product list }
    post:
      summary: Create a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Created }
        '401': { description: Unauthorized }
  /api/products/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get a product
      responses:
        '200': { description: Product }
        '404': { description: Not found }
    put:
      summary: Update a product
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete a product
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, registrationKey]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        registrationKey: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    ProductInput:
      type: object
      required: [name, price, category, images, stock]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0 }
        category: { type: string }
        images:
          type: array
          items: { type: string, format: uri }
        stock: { type: integer, minimum: 0 }
